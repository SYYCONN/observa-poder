[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "de-olho-na-politica-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "ijson>=3.4,<4",
  "greenlet>=3,<4",
  "reportlab>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py313"]
